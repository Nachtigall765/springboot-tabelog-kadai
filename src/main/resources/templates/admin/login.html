<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理者ログイン</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>管理者ログイン</h1>

<p th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</p>

<form th:action="@{/login}" method="post">
    <div>
        <label>メールアドレス</label>
        <input type="email" name="username" required>
    </div>

    <div>
        <label>パスワード</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">ログイン</button>
</form>

</body>
</html>
