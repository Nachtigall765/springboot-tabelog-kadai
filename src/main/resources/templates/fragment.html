<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
 xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>

    <!-- meta要素 -->
    <div th:fragment="meta" th:remove="tag">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </div>

    <!-- CSS -->
    <div th:fragment="styles" th:remove="tag">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLWZJEdK2Kadq2F9CUG65"
              crossorigin="anonymous">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap"
              rel="stylesheet">

        <link th:href="@{/css/style.css}" rel="stylesheet">

    </div>

    <title>店舗検索サイト</title>
</head>

<body>

    <!-- ヘッダー -->
<div th:fragment="header" th:remove="tag">
    <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand" th:href="@{/}">
                店舗検索サイト
            </a>

            <div>
                <a class="me-3" th:href="@{/shops}">店舗一覧</a>

                <!-- 未ログイン時 -->
                <span sec:authorize="isAnonymous()">
                    <a class="me-3" th:href="@{/login}">ログイン</a>
                    <a th:href="@{/signup}">会員登録</a>
                </span>

                <!-- ログイン時 -->
                <span sec:authorize="isAuthenticated()">
                    <a class="me-3" th:href="@{/mypage}">マイページ</a>

                    <form th:action="@{/logout}" method="post"
                          style="display:inline;">
                        <button type="submit">ログアウト</button>
                    </form>
                </span>
            </div>

        </div>
    </nav>
</div>


    <!-- フッター -->
    <div th:fragment="footer" th:remove="tag">
        <footer class="py-3">
            <div class="d-flex justify-content-center align-items-center">
                <p class="text-center text-muted small mb-0">
                    &copy; 店舗検索サイト All rights reserved.
                </p>
            </div>
        </footer>
    </div>


    <!-- JavaScript -->
    <div th:fragment="scripts" th:remove="tag">

        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
                crossorigin="anonymous">
        </script>

    </div>

</body>
</html>
