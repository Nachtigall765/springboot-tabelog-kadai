<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>店舗詳細</title>
</head>

<body>

<div th:replace="~{fragment :: header}"></div>

<main>
<div class="site-container page-container">

    <div class="shop-detail">

        <span class="shop-category"
              th:text="${shop.category.name}">
            カテゴリ
        </span>

        <h1 class="shop-detail-title"
            th:text="${shop.name}">
            店舗名
        </h1>

        <div class="shop-info">
            <p>
                <strong>住所</strong><br>
                <span th:text="${shop.address}">住所</span>
            </p>

            <p>
                <strong>店舗説明</strong><br>
                <span th:text="${shop.description}">店舗説明</span>
            </p>
        </div>

        <div class="shop-actions">

            <a th:href="@{/reservations/create(shopId=${shop.id})}"
               class="main-button">
                この店舗を予約する
            </a>

            <form th:action="@{/favorites/{shopId}(shopId=${shop.id})}"
                  method="post">
                <button type="submit">
                    お気に入りに追加
                </button>
            </form>

        </div>

        <section class="review-section">

            <div class="review-heading">
                <h2>レビュー</h2>

                <a th:href="@{/reviews/create(shopId=${shop.id})}"
                   class="main-button">
                    レビューを投稿する
                </a>
            </div>

            <p th:if="${reviews == null or #lists.isEmpty(reviews)}"
               class="empty-message">
                まだレビューはありません。
            </p>

            <div th:if="${reviews != null}"
                 th:each="review : ${reviews}"
                 class="review-card">

                <p class="review-rating">
                    評価：
                    <strong th:text="${review.rating}">5</strong>
                    / 5
                </p>

                <p th:text="${review.body}">
                    レビュー内容
                </p>

                <div class="review-actions">

                    <a th:href="@{/reviews/{id}/edit(id=${review.id})}">
                        編集
                    </a>

                    <form th:action="@{/reviews/{id}/delete(id=${review.id})}"
                          method="post">
                        <button type="submit"
                                class="delete-button">
                            削除
                        </button>
                    </form>

                </div>

            </div>

        </section>

    </div>

    <div class="back-link">
        <a th:href="@{/shops}">← 店舗一覧へ戻る</a>
        &nbsp;
        <a th:href="@{/}">トップページへ戻る</a>
    </div>

</div>
</main>

<div th:replace="~{fragment :: footer}"></div>
<div th:replace="~{fragment :: scripts}"></div>

</body>
</html>
